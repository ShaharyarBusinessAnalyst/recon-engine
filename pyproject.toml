[project]
name = "recon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ShaharyarBusinessAnalyst", email = "shaharyaramjad99@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
